spring.application.name=Expert_hub
spring.datasource.url=jdbc:mysql://localhost:3306/expert_hub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB


jwt.expiration=3600000

server.port=9094

# MSG91 API Configuration
msg91.authkey=Replace_Later_With_Your_Auth_Key
msg91.template_id=Replace_Later_With_Your_Template_ID
msg91.url.send=https://control.msg91.com/api/v5/otp
msg91.url.verify=https://control.msg91.com/api/v5/otp/verify
msg91.url.resend=https://control.msg91.com/api/v5/otp/retry


# Path to service account JSON file
google.service.account.json.path=classpath:service_account.json
jwt.secret=CHANGE_THIS_SECRET_FOR_PROD_MUST_BE_LONG_ENOUGH



logging.file.name=myapp.log


# Set the log level for a specific package or class to INFO
logging.level.org.springframework=INFO

# Set the log level for your application's package to INFO
logging.level.com.example=INFO

auth.key=Replace_Later_With_Your_Auth_Key
send.id=Replace_later_IIIIIII
template.id=Replace_Later_With_Your_Template_ID

# Twilio Configuration
twilio.account_sid=Replace_Later_With_Your_Twilio_Account_SID
twilio.auth_token=Replace_Later_With_Your_Twilio_Auth_Token
twilio.phone_number=Replace_Later_With_Your_Twilio_Phone_Number


# ✅ Reduce max pool size (You only have 2-3 users)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5

# Razorpay Configuration
razorpay.key.id=YOUR_RAZORPAY_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_KEY_SECRET
razorpay.webhook.secret=YOUR_RAZORPAY_WEBHOOK_SECRET
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=600000  
spring.datasource.hikari.connection-timeout=3000  

# ✅ Keep Prepared Statement Cache Simple
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=100
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=1024
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# Twilio API Configuration (Placeholder values to prevent startup crash)
twilio.account_sid=AC00000000000000000000000000000000
twilio.auth_token=00000000000000000000000000000000
twilio.phone_number=+10000000000

# Cloudinary CDN Configuration
cloudinary.cloud_name=your_cloud_name
cloudinary.api_key=your_api_key
cloudinary.api_secret=your_api_secret

# Razorpay Payment Configuration
razorpay.api_key=your_razorpay_key
razorpay.api_secret=your_razorpay_secret

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# FCM Configuration
fcm.project.id=YOUR_PROJECT_ID_HERE
